<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កំពុងស្ថិតក្នុងការសាងសង់</title>
    <!-- ទាញយកហ្វុង Battambang ពី Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Battambang', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1f4068, #162447, #1b1b2f);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ប្រអប់ាតុក្កតា / Glassmorphism Container */
        .construction-container {
            text-align: center;
            padding: 50px 40px;
            max-width: 450px;
            width: 90%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-in-out;
        }

        /* រូបតំណាង Fix Tool (Wrench Icon Animation) */
        .tool-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounceTool 2s infinite ease-in-out;
        }

        .tool-icon svg {
            width: 80px;
            height: 80px;
            fill: #ff758c;
            filter: drop-shadow(0 4px 10px rgba(228, 63, 90, 0.4));
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #e43f5a, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #d1d5db;
            font-size: 1rem;
            font-weight: 300;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* ប៊ូតុងត្រឡប់ក្រោយ */
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 25px;
            background: #e43f5a;
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(228, 63, 90,0.4);
        }

        .back-btn:hover {
            background: #ff5270;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(228, 63, 90, 0.6);
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceTool {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(-15deg);
            }
        }
    </style>
</head>
<body>

    <div class="construction-container">
        <!-- Fix Tool SVG Icon -->
        <div class="tool-icon">
            <svg viewBox="0 0 24 24">
                <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.5-7.4-1.3l6.5 6.5-2.8 2.8-6.5-6.5C1.3 7.9 1.8 11 3.8 13c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l1.5-1.5c.4-.4.4-1 0-1.4z"/>
            </svg>
        </div>

        <h1>ទំព័រនេះកំពុងស្ថិតក្នុងការសាងសង់</h1>
        <p>នេះគ្រាន់ជាការសាកល្បង ។ <br>សូមអភ័យទោស! យើងខ្ញុំកំពុងរៀបចំ និងអភិវឌ្ឍ។ <br>និងរួចរាល់ឆាប់ៗនេះ។ </p>
        
        <!-- ប៊ូតុងត្រឡប់ក្រោយ (អាចប្តូរជា grade7.html ឬ home.html តាមតម្រូវការ) -->
        <a href="index.html" class="back-btn">
            &#8592; ត្រឡប់ក្រោយ
        </a>
    </div>

</body>
</html>
